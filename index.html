<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>세실리아의 음악 응접실 — Classic BGM DJ 3D</title>
<meta name="description" content="VRM 집사가 안내하는 3D 클래식 음악 응접실. 권리가 확인된 음원만 재생합니다.">
<link rel="stylesheet" href="/src/ui/style.css">
</head>
<body>
  <div id="scene" class="scene"></div>

  <!--
    조작은 브라우저 아래에 붙는 막대에서 한다. 장면 안에 두면 화면 비율이
    바뀔 때마다 자리가 흔들리고, 가로 모드에서는 화면 밖으로 내려갔다.
  -->
  <div id="console" class="console">
    <!-- 곡이 걸리기 전에는 재생 조작을 감춘다. 누를 수 없는 단추는 없는 편이 낫다. -->
    <div class="console__row" id="transport" hidden>
      <button id="prev" class="led led--icon" type="button" aria-label="이전 곡">◀</button>
      <button id="play" class="led led--main" type="button">재생</button>
      <button id="next" class="led led--icon" type="button" aria-label="다음 곡">▶</button>
    </div>
    <div class="console__row">
      <button id="start-ask" class="led" type="button">취향 고르기</button>
      <button id="start-auto" class="led" type="button">맡길게</button>
    </div>
    <div class="console__row" id="auto-row" hidden>
      <button id="reshuffle" class="led" type="button">다른 결로</button>
      <button id="sleep" class="led" type="button">종료 예약</button>
    </div>
    <p id="console-notice" class="console__notice" role="status" aria-live="polite"></p>
  </div>

  <!-- 취향 고르기 — 멀리서도 읽히도록 화면을 덮는 큰 카드로 띄운다. -->
  <div id="ask" class="ask" hidden>
    <div class="ask__card">
      <p class="ask__step" id="ask-step"></p>
      <h2 class="ask__question" id="ask-question"></h2>
      <p class="ask__hint" id="ask-hint"></p>
      <div class="ask__options" id="ask-options"></div>
      <div class="ask__nav">
        <button id="ask-back" class="led" type="button">뒤로</button>
        <button id="ask-skip" class="led" type="button">이건 맡길게요</button>
      </div>
    </div>
  </div>

  <!-- 화면에 보이지 않지만 키보드와 낭독기를 위해 같은 기능을 남겨 둔다. -->
  <div id="a11y" class="sr-only">
    <h1>세실리아의 음악 응접실</h1>
    <p id="now-announce" role="status" aria-live="polite"></p>
    <p id="butler-status" role="status" aria-live="polite"></p>
    <p id="subtitle-text" aria-live="polite"></p>
    <p id="now-title"></p>
    <p id="now-meta"></p>
    <p id="problem" role="status" aria-live="polite"></p>

    <button id="repeat-greeting" type="button">인사 다시 듣기</button>
    <button id="voice-toggle" type="button" aria-pressed="false">음성 끄기</button>

    <label for="seek">재생 위치</label>
    <input id="seek" type="range" min="0" max="1000" value="0">
    <label for="volume">음량</label>
    <input id="volume" type="range" min="0" max="100" value="80">
  </div>

  <noscript>
    <p>이 서비스는 자바스크립트가 필요합니다.
      <a href="https://progh2.github.io/classic-bgm-dj/">2D 버전</a>을 이용해 주세요.</p>
  </noscript>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
