<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>세바스티안의 음악 응접실 — Classic BGM DJ 3D</title>
<meta name="description" content="VRM 집사가 안내하는 3D 클래식 음악 응접실. 권리가 확인된 음원만 재생합니다.">
<link rel="stylesheet" href="/src/ui/style.css">
</head>
<body>
  <div id="scene" class="scene" aria-hidden="true"></div>

  <!-- 소리 있는 자동 재생은 브라우저 정책에 막힌다. 첫 조작을 여기서 받는다. -->
  <div id="gate" class="gate">
    <div class="gate__card">
      <p class="gate__eyebrow">Classic BGM DJ</p>
      <h1 class="gate__title">세바스티안의 음악 응접실</h1>
      <p class="gate__lead">
        권리가 확인된 클래식 음원만 골라 둔 응접실입니다.
        집사가 취향을 묻거나, 맡기시면 알아서 골라 틀어 드립니다.
      </p>
      <div class="gate__actions">
        <button id="enter-voice" class="btn btn--primary" type="button">응접실 입장 · 음성 켜기</button>
        <button id="enter-quiet" class="btn" type="button">조용히 입장</button>
      </div>
      <p class="gate__note">
        음성은 기기에 설치된 한국어 음성을 사용합니다. 없으면 자막으로 진행합니다.
      </p>
    </div>
  </div>

  <div id="hud" class="hud" hidden>
    <p id="butler-status" class="hud__status" role="status" aria-live="polite"></p>
    <div id="subtitle" class="subtitle" hidden>
      <p class="subtitle__who">세바스티안</p>
      <p id="subtitle-text" class="subtitle__text" aria-live="polite"></p>
    </div>
    <div id="ask" class="ask" hidden>
      <p class="ask__step" id="ask-step"></p>
      <h2 class="ask__question" id="ask-question"></h2>
      <p class="ask__hint" id="ask-hint"></p>
      <div class="ask__options" id="ask-options"></div>
      <div class="ask__nav">
        <button id="ask-back" class="btn btn--small" type="button">뒤로</button>
        <button id="ask-skip" class="btn btn--small" type="button">이건 맡길게요</button>
      </div>
    </div>

    <div id="player" class="player" hidden>
      <div class="player__now">
        <p class="player__title" id="now-title">준비 중</p>
        <p class="player__meta" id="now-meta"></p>
      </div>
      <div class="player__seek">
        <span class="player__time" id="now-time">--:--</span>
        <input id="seek" class="player__range" type="range" min="0" max="1000" value="0"
               aria-label="재생 위치">
        <span class="player__time" id="now-duration">--:--</span>
      </div>
      <div class="player__buttons">
        <button id="prev" class="btn btn--small" type="button">◀ 이전</button>
        <button id="play" class="btn btn--primary btn--small" type="button">재생</button>
        <button id="next" class="btn btn--small" type="button">다음 ▶</button>
        <label class="player__volume">
          음량
          <input id="volume" type="range" min="0" max="100" value="80" aria-label="음량">
        </label>
      </div>
      <p class="player__problem" id="problem" role="status" aria-live="polite"></p>
    </div>

    <div class="hud__controls">
      <button id="start-ask" class="btn btn--small" type="button">취향 고르기</button>
      <button id="start-auto" class="btn btn--small" type="button">맡길게</button>
      <button id="repeat-greeting" class="btn btn--small" type="button">인사 다시 듣기</button>
      <button id="voice-toggle" class="btn btn--small" type="button" aria-pressed="false">음성 켜기</button>
    </div>
  </div>

  <noscript>
    <p>이 서비스는 자바스크립트가 필요합니다.
      <a href="https://progh2.github.io/classic-bgm-dj/">2D 버전</a>을 이용해 주세요.</p>
  </noscript>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
