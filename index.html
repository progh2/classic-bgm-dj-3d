<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>세바스티안의 음악 응접실 — Classic BGM DJ 3D</title>
<meta name="description" content="VRM 집사가 안내하는 3D 클래식 음악 응접실. 권리가 확인된 음원만 재생합니다.">
<link rel="stylesheet" href="/src/ui/style.css">
</head>
<body>
  <div id="scene" class="scene"></div>

  <!--
    조작은 모두 3D 안의 판에서 한다. 아래는 화면에 보이지 않지만 키보드와
    화면 낭독기를 위해 같은 기능을 제공하는 층이다. 3D 만으로는 낭독기가
    읽을 것이 없고 Tab 으로 옮겨 다닐 수도 없다.
  -->
  <div id="a11y" class="sr-only">
    <h1>세바스티안의 음악 응접실</h1>
    <p id="now-announce" role="status" aria-live="polite"></p>
    <p id="butler-status" role="status" aria-live="polite"></p>
    <p id="subtitle-text" aria-live="polite"></p>
    <p id="now-title"></p>
    <p id="now-meta"></p>
    <p id="problem" role="status" aria-live="polite"></p>

    <label for="seek">재생 위치</label>
    <input id="seek" type="range" min="0" max="1000" value="0">
    <label for="volume">음량</label>
    <input id="volume" type="range" min="0" max="100" value="80">

    <div id="ask" hidden>
      <p id="ask-step"></p>
      <h2 id="ask-question"></h2>
      <p id="ask-hint"></p>
      <div id="ask-options"></div>
      <button id="ask-back" type="button">뒤로</button>
      <button id="ask-skip" type="button">이건 맡길게요</button>
    </div>
  </div>

  <!--
    조작판만 3D 밖으로 뺀다. 장면 안에 두면 화면 비율이 바뀔 때마다 위치가
    흔들리고, 가로 모드에서는 화면 아래로 내려가 손이 닿지 않았다.
    브라우저 아래에 붙여 두는 편이 어느 기기에서나 같은 자리에 있다.
  -->
  <div id="console" class="console">
    <div class="console__row">
      <button id="prev" class="led led--icon" type="button" aria-label="이전 곡">◀</button>
      <button id="play" class="led led--main" type="button">재생</button>
      <button id="next" class="led led--icon" type="button" aria-label="다음 곡">▶</button>
    </div>
    <div class="console__row">
      <button id="start-ask" class="led" type="button">취향 고르기</button>
      <button id="start-auto" class="led" type="button">맡길게</button>
      <button id="repeat-greeting" class="led" type="button">인사</button>
      <button id="voice-toggle" class="led" type="button" aria-pressed="false">음성 켜기</button>
    </div>
    <p id="console-notice" class="console__notice" role="status" aria-live="polite"></p>
  </div>

  <noscript>
    <p>이 서비스는 자바스크립트가 필요합니다.
      <a href="https://progh2.github.io/classic-bgm-dj/">2D 버전</a>을 이용해 주세요.</p>
  </noscript>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
